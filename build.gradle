plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.143' apply false
}

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version
}

// Loader tasks stay in the loader projects; parents aggregate their children.
def versionProjects = subprojects.findAll { it.parent == rootProject && it.name.startsWith('mc-') }
configure(versionProjects) {
    apply plugin: 'base'
    description = "Minecraft ${name.substring(3)} build targets."
    def modulePaths = childProjects.values().collect { it.path }
    ['build', 'assemble', 'check', 'clean'].each { name ->
        tasks.named(name) { dependsOn modulePaths.collect { "${it}:${name}" } }
    }
}

def aggregateProjects = [':cores'] + versionProjects.collect { it.path }
['build', 'assemble', 'check', 'clean'].each { name ->
    tasks.named(name) { dependsOn aggregateProjects.collect { "${it}:${name}" } }
}

// Select one loader explicitly to avoid launching all versions from a bare run task.
def aggregatePaths = [rootProject.path] + versionProjects.collect { it.path }
def selectedDirectory = gradle.startParameter.projectDir ?: gradle.startParameter.currentDir
def selectedPath = allprojects.find { it.projectDir == selectedDirectory }?.path ?: rootProject.path
def localProperties = new Properties()
def localFile = file('gradle-local.properties')
if (localFile.isFile()) localFile.withReader('UTF-8') { localProperties.load(it) }
def runTarget = providers.gradleProperty('runTarget').getOrElse(localProperties.getProperty('runTarget', '')).trim()
def launchNames = ['runClient', 'runServer', 'runClientSmoke', 'runGameTestServer', 'runData']
gradle.startParameter.setTaskRequests(gradle.startParameter.taskRequests.collect { request ->
    def scope = request.projectPath ?: selectedPath
    def args = request.args.collect { argument ->
        if (!(scope in aggregatePaths) || !(argument in launchNames)) return argument
        def target = runTarget ? findProject(runTarget) : null
        if (target == null || !(target.name in ['neoforge', 'fabric', 'forge'])
                || !versionProjects.contains(target.parent)
                || (scope != ':' && target.parent.path != scope)) {
            throw new GradleException('Select a loader task, for example :mc-1.21.1:neoforge:' + argument
                    + ', or set runTarget=:mc-1.21.1:neoforge in gradle-local.properties (or with -PrunTarget).')
        }
        def resolved = "${target.path}:${argument}".toString()
        logger.lifecycle("Development launch: ${argument} -> ${resolved}")
        resolved
    }
    args == request.args ? request : new org.gradle.internal.DefaultTaskExecutionRequest(args, request.projectPath, request.rootDir)
})

tasks.named('wrapper', Wrapper) { distributionType = Wrapper.DistributionType.BIN }
