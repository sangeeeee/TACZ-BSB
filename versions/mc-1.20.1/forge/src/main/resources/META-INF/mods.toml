mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tacz"
mandatory=true
versionRange="${tacz_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tacz_c"
mandatory=true
versionRange="${tacz_c_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
mandatory=true
versionRange="${create_version_range}"
ordering="AFTER"
side="BOTH"
