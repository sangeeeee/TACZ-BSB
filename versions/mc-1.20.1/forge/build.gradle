import groovy.json.JsonSlurper
import java.util.zip.ZipFile

plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge'
    id 'idea'
}

apply from: rootProject.file('gradle/load-target-properties.gradle')
evaluationDependsOn(':cores')
description = 'TACZ: Better Streamline Bullet for Forge 1.20.1.'
base.archivesName = "${mod_id}-forge"
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { name = 'CurseMaven'; url = 'https://www.cursemaven.com' } }
        filter { includeModule 'curse.maven', 'tacz-create-1109760' }
    }
}
configurations {
    commonJava { canBeConsumed = false; canBeResolved = true }
    commonResources { canBeConsumed = false; canBeResolved = true }
    requiredModArchives { canBeConsumed = false; canBeResolved = true }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
legacyForge {
    enable {
        forgeVersion = "${minecraft_version}-${forge_version}"
        disableRecompilation = false
    }
    runs {
        client { client(); gameDirectory = file('run') }
        clientSmoke {
            client()
            gameDirectory = file('build/client-smoke')
            systemProperty 'tacz_bsb.clientSmoke', 'true'
            programArguments.addAll '--width', '1200', '--height', '800'
        }
        server { server(); gameDirectory = file('run'); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('build/gametest-run')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
    }
    mods {
        tacz_bsb {
            sourceSet sourceSets.main
            sourceSet project(':cores').sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }
}

def requiredMods = [
    "maven.modrinth:timeless-and-classics-zero:${tacz_forge_version_id}",
    "curse.maven:tacz-create-1109760:${tacz_c_file_id}",
    "maven.modrinth:create:${create_forge_version_id}"
]
// Create's public block entity types implement Ponder interfaces. Its bundled
// Ponder API is needed when the development tests call the real machine methods.
def ponderTestApi = layout.buildDirectory.file('gameTest-api/ponder.jar')
def extractPonderTestApi = tasks.register('extractPonderTestApi') {
    inputs.files(configurations.requiredModArchives)
    outputs.file(ponderTestApi)
    doLast {
        def createArchive = configurations.requiredModArchives.files.find { it.name == "create-${create_forge_version_id}.jar" }
        if (createArchive == null) throw new GradleException('Missing pinned Create archive for the test API.')
        new ZipFile(createArchive).withCloseable { archive ->
            def libraries = archive.getInputStream(archive.getEntry('META-INF/jarjar/metadata.json')).withCloseable {
                new JsonSlurper().parse(it, 'UTF-8')
            }
            def ponder = libraries.jars.find { it.identifier.artifact == 'Ponder-Forge-1.20.1' }
            if (ponder == null) throw new GradleException('Missing bundled Ponder API in Create.')
            def target = ponderTestApi.get().asFile
            target.parentFile.mkdirs()
            archive.getInputStream(archive.getEntry(ponder.path)).withCloseable { input ->
                target.withOutputStream { output -> input.transferTo(output) }
            }
        }
    }
}
dependencies {
    gameTestCompileOnly files(ponderTestApi).builtBy(extractPonderTestApi)
    // Optional APIs are compile-only; Endless Ammo is not a runtime prerequisite.
    modCompileOnly("maven.modrinth:tacz-endless-ammo:${endless_ammo_version_id}") { transitive = false }
    compileOnly 'mezz.jei:jei-1.20.1-common-api:15.20.0.106'
    compileOnly 'mezz.jei:jei-1.20.1-forge-api:15.20.0.106'
    if (providers.gradleProperty('jeiSmoke').isPresent()) {
        modRuntimeOnly 'mezz.jei:jei-1.20.1-forge:15.20.0.106'
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.0'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    implementation 'io.github.llamalad7:mixinextras-forge:0.5.0'
    jarJar('io.github.llamalad7:mixinextras-forge:0.5.0') {
        version { strictly '[0.5.0,0.6)'; prefer '0.5.0' }
    }
    compileOnly project(':cores')
    commonJava project(path: ':mc-1.20.1:common', configuration: 'commonJava')
    commonResources project(path: ':mc-1.20.1:common', configuration: 'commonResources')
    requiredMods.each { coordinate ->
        modImplementation(coordinate) { transitive = false }
        requiredModArchives(coordinate) { transitive = false }
    }
}
sourceSets.main.java.srcDir(configurations.commonJava)
sourceSets.main.resources {
    srcDir(configurations.commonResources)
    exclude '**/*.bbmodel', '**/.cache/**', '**/.gitkeep'
}

def metadataProperties = [
    mod_id: mod_id, mod_name: mod_name, mod_version: project.version,
    mod_license: mod_license, mod_authors: mod_authors,
    minecraft_version_range: minecraft_version_range,
    forge_version_range: forge_version_range, loader_version_range: loader_version_range,
    tacz_version_range: tacz_version_range, tacz_c_version_range: tacz_c_version_range,
    create_version_range: create_version_range
]
tasks.named('processResources') {
    dependsOn tasks.named('compileJava')
    from(layout.buildDirectory.dir('mixin')) { include 'tacz_bsb.refmap.json' }
    inputs.properties(metadataProperties)
    filesMatching('META-INF/mods.toml') { expand(metadataProperties) }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) {
    filesMatching('tacz_bsb.refmap.json') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
    from(project(':cores').sourceSets.main.output)
    from(rootProject.files('LICENSE', 'TEMPLATE_LICENSE.txt'))
    manifest.attributes('Implementation-Version': project.version, 'MixinConfigs': 'tacz_bsb.mixins.json')
}
mixin {
    add sourceSets.main, 'tacz_bsb.refmap.json'
    config 'tacz_bsb.mixins.json'
}
idea.module { downloadSources = true; downloadJavadoc = true }

// Verify the published archives, including required Jar-in-Jar libraries. Forge
// discovers those libraries at launch; they are not rebundled into the BSB JAR.
tasks.register('verifyDependencies') {
    group = 'verification'
    description = 'Verify required mods, embedded libraries and the compile-only Endless Ammo scope.'
    inputs.files(configurations.requiredModArchives)
    inputs.property('requiredModIds', ['tacz', 'tacz_c', 'create'])
    inputs.property('requiredEmbeddedLibraries', ['simplebedrockmodel', 'commons-math3',
        'luaj-core', 'luaj-jse', 'bcel', 'mixinextras-forge',
        'Registrate', 'flywheel-forge-1.20.1', 'Ponder-Forge-1.20.1'])
    doLast { task ->
        def modIds = new LinkedHashSet<String>()
        def libraries = new LinkedHashSet<String>()
        task.inputs.files.files.each { artifact ->
            new ZipFile(artifact).withCloseable { archive ->
                def metadata = archive.getEntry('META-INF/mods.toml')
                if (metadata == null) throw new GradleException("Not a Forge mod: ${artifact.name}")
                def text = archive.getInputStream(metadata).withCloseable { it.getText('UTF-8') }
                (text =~ /(?m)^\s*modId\s*=\s*"([^"]+)"/).each { match -> modIds.add(match[1]) }
                def jarJar = archive.getEntry('META-INF/jarjar/metadata.json')
                if (jarJar != null) {
                    def embedded = archive.getInputStream(jarJar).withCloseable { new JsonSlurper().parse(it, 'UTF-8') }
                    embedded.jars.each { library ->
                        if (archive.getEntry(library.path) == null) {
                            throw new GradleException("Missing nested library in ${artifact.name}: ${library.path}")
                        }
                        libraries.add(library.identifier.artifact)
                    }
                }
            }
        }
        def missingMods = task.inputs.properties.requiredModIds.findAll { !modIds.contains(it) }
        def missingLibraries = task.inputs.properties.requiredEmbeddedLibraries.findAll { !libraries.contains(it) }
        if (!missingMods.empty || !missingLibraries.empty) {
            throw new GradleException("Missing Forge dependencies: mods=${missingMods}, libraries=${missingLibraries}")
        }
        def isEndlessAmmo = { component ->
            component.moduleVersion?.group == 'maven.modrinth' && component.moduleVersion?.name == 'tacz-endless-ammo'
        }
        if (!configurations.compileClasspath.incoming.resolutionResult.allComponents.any(isEndlessAmmo)
                || configurations.runtimeClasspath.incoming.resolutionResult.allComponents.any(isEndlessAmmo)) {
            throw new GradleException('Endless Ammo must be present only on the compile classpath.')
        }
        task.logger.lifecycle("Forge dependencies verified: 3 mods and ${libraries.size()} embedded libraries.")
        task.logger.lifecycle('Endless Ammo verified: compile-only, excluded from the runtime classpath.')
    }
}
tasks.named('check') {
    dependsOn 'verifyDependencies', ':cores:check', ':mc-1.20.1:common:check'
}
def gameTestLog = layout.buildDirectory.file('gametest-run/logs/latest.log')
tasks.named('runGameTestServer') {
    dependsOn 'verifyDependencies'
    doLast {
        def report = gameTestLog.get().asFile
        if (!report.isFile() || !report.getText('UTF-8').contains('required tests passed')) {
            throw new GradleException('Forge GameTests did not pass; inspect gametest-run/logs/latest.log.')
        }
    }
}
def prepareClientSmokeWorld = tasks.register('prepareClientSmokeWorld', Sync) {
    dependsOn 'runGameTestServer'
    from 'build/gametest-run/world'
    into 'build/client-smoke/saves/BSBTest'
    exclude 'session.lock'
}
tasks.named('runClientSmoke') {
    dependsOn prepareClientSmokeWorld
    def smokeLog = layout.buildDirectory.file('client-smoke/logs/latest.log')
    doLast {
        if (!smokeLog.get().asFile.getText('UTF-8').contains('BSB_CLIENT_SMOKE_PASSED')) {
            throw new GradleException('Client smoke checks did not complete; inspect client-smoke/logs/latest.log.')
        }
    }
}
